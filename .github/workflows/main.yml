
name: NearChat Android Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NearChat APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Download project
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Step 2: Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Step 3: Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 4: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Step 5: Check Java and Gradle
      - name: Check Environment
        run: |
          java -version
          chmod +x gradlew
          ./gradlew --version

      # Step 6: Build Debug APK
      - name: Build NearChat APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Step 7: Upload APK
      - name: Upload NearChat APK
        uses: actions/upload-artifact@v4
        with:
          name: NearChat-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
