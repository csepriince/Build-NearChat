name: Build NearChat
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nearchat-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild project folders
        run: |
          set -e
          if [ -f update.zip ]; then unzip -oq update.zip; echo "update.zip applied"; fi
          P=work/NearChat
          R=$P/app/src/main/res
          mkdir -p $P/app/src/main $P/docs $R/values $R/values-night $R/drawable-nodpi $R/mipmap-anydpi-v26 $R/xml
          cp settings.gradle.kts gradle.properties $P/
          for f in build.gradle*.kts; do
            if grep -q namespace "$f"; then cp "$f" $P/app/build.gradle.kts; else cp "$f" $P/build.gradle.kts; fi
          done
          cp proguard-rules.pro $P/app/
          cp AndroidManifest.xml $P/app/src/main/
          for f in *.kt; do
            case "$f" in *" ("*) continue;; esac
            pkg=$(grep -m1 '^package ' "$f" | sed 's/^package //' | tr -d '\r ')
            d=$P/app/src/main/java/$(echo "$pkg" | tr . /)
            mkdir -p "$d"
            cp "$f" "$d/"
          done
          cp strings.xml colors.xml $R/values/
          for f in themes*.xml; do
            if grep -q "Light" "$f"; then cp "$f" $R/values/themes.xml; else cp "$f" $R/values-night/themes.xml; fi
          done
          for f in logo*.png; do
            if file "$f" | grep -q "512 x 512"; then cp "$f" $R/drawable-nodpi/logo.png; else cp "$f" $P/docs/logo.png; fi
          done
          cp ic_launcher_fg.png $R/drawable-nodpi/
          cp ic_launcher.xml $R/mipmap-anydpi-v26/
          if [ -f file_paths.xml ]; then cp file_paths.xml $R/xml/; fi
          cp index.html $P/docs/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle :app:assembleDebug --stacktrace
        working-directory: work/NearChat
      - run: cp work/NearChat/app/build/outputs/apk/debug/app-debug.apk work/NearChat/docs/NearChat.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NearChat (latest APK)
          files: work/NearChat/docs/NearChat.apk
          make_latest: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/NearChat/docs
  pages:
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

