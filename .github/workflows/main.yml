name: Build NearChat APK

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "docs/NearChat.apk"

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Source Code
        run: |
          mkdir -p work/NearChat
          if [ -f source.zip ]; then
            unzip -o source.zip -d work/NearChat
          else
            echo "ERROR: source.zip not found!"
            exit 1
          fi

      - name: Locate Android Project
        id: project
        run: |
          GRADLEW=$(find work/NearChat -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found!"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$GRADLEW")
          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          chmod +x "$GRADLEW"

      - name: Build NearChat APK
        working-directory: .
        run: |
          cd "${{ steps.project.outputs.root }}"
          ./gradlew clean assembleDebug --no-daemon

      - name: Copy APK
        run: |
          mkdir -p docs

          APK=$(find work/NearChat -type f \
            -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated!"
            exit 1
          fi

          cp "$APK" docs/NearChat.apk
          echo "APK successfully generated!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NearChat-APK
          path: docs/NearChat.apk

      - name: Commit APK to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/NearChat.apk

          if ! git diff --cached --quiet; then
            git commit -m "Build NearChat APK"
            git push
          else
            echo "APK unchanged."
          fi
